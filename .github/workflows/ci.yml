name: CI

on:
  push:
    branches: [ main, "*" ]
  pull_request:
    branches: [ main, "*" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET 10.0
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore cosmosdb-delete-by-sql.sln

      - name: Run tests
        run: dotnet test CosmosDbDeleteBySql.Tests/CosmosDbDeleteBySql.Tests.csproj --no-build --verbosity normal

      - name: Build solution
        run: dotnet build cosmosdb-delete-by-sql.sln --no-restore --configuration Release
